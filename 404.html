    <title>Seashell</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {

    <!--
      IDEA-125: the first paint, shown while the app's JavaScript downloads (the door link, sign-in,
      /billing-return after Stripe). Colours are Colors.light / Colors.dark from constants/theme.ts
      (bg, text, accent, honey); __tests__/web-boot-shell.test.ts keeps them in step. app/_layout.tsx
      fades it out once the app has drawn (lib/web-boot-shell.ts).
    -->
    <style id="seashell-boot-style">
      html,
      body {
        margin: 0;
        background: #FFF9F2;
      }
      #seashell-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #FFF9F2;
        color: #1A1A18;
        transition: opacity 240ms ease-out;
      }
      #seashell-boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #seashell-boot .mark {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
      }
      #seashell-boot .mark span {
        display: block;
        width: 8px;
        border-radius: 4px;
        background: linear-gradient(180deg, #FFB938, #FF6B4A);
        animation: seashell-breathe 1.6s ease-in-out infinite;
      }
      #seashell-boot .mark span:nth-child(1) { height: 12px; animation-delay: 0s; }
      #seashell-boot .mark span:nth-child(2) { height: 24px; animation-delay: 0.12s; }
      #seashell-boot .mark span:nth-child(3) { height: 36px; animation-delay: 0.24s; }
      #seashell-boot .mark span:nth-child(4) { height: 26px; animation-delay: 0.36s; }
      #seashell-boot .mark span:nth-child(5) { height: 14px; animation-delay: 0.48s; }
      #seashell-boot .word {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 24px;
        line-height: 32px;
        letter-spacing: 0.2px;
      }
      @keyframes seashell-breathe {
        0%, 100% { transform: scaleY(0.7); opacity: 0.7; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #seashell-boot .mark span { animation: none; }
        #seashell-boot { transition: none; }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #seashell-boot {
          background: #14110E;
        }
        #seashell-boot {
          color: #FBF1E4;
        }
        #seashell-boot .mark span {
          background: linear-gradient(180deg, #FFC75E, #FF8566);
        }
      }
    </style>
  <link rel="icon" href="/favicon.ico"/></head>

      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="word" aria-hidden="true">Seashell</div>
    </div>
